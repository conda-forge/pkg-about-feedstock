schema_version: 1

context:
  name: pkg-about
  version: "2.4.3"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0aa3b8938f691218d828fb4a0b4f3cc1d4fbed68c473c407db7b8a06d7c14748

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=81.0.0
    - packaging >=26.2.0
    - pip
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=4.6
    - typing_extensions >=4.15.0
    - packaging >=26.2.0
    - python-build >=1.5.0

tests:
  - python:
      imports:
        - pkg_about
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Shares Python package metadata at runtime.
  license: Zlib
  license_file: LICENSE
  homepage: https://github.com/karpierz/pkg_about
  documentation: https://pkg-about.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
