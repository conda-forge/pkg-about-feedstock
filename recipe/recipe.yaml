schema_version: 1

context:
  name: pkg-about
  version: "2.4.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 48ea967af618f6d959845a5c5451f71adc735a115ffee11c8539007d28ce01a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=81.0.0
    - packaging >=26.3.0
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.16.0
    - packaging >=26.3.0
    - python-build >=1.6.1

tests:
  - python:
      imports:
        - pkg_about
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Shares Python package metadata at runtime.
  license: Zlib
  license_file: LICENSE
  homepage: https://github.com/karpierz/pkg_about
  documentation: https://pkg-about.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
